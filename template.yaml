AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Stock Trading Bot — Automated daily trading via Alpaca API

Parameters:
  Environment:
    Type: String
    Default: paper
    AllowedValues: [paper, live, experimental]
    Description: Trading environment. Determines SSM prefix, S3 bucket, and stack isolation.
  NotificationEmail:
    Type: String
    Default: ""
    Description: Email address for trade alerts. Leave empty to skip email notifications.
  MonitorIntervalMinutes:
    Type: Number
    Default: 1
    Description: Stop-loss and trading monitor interval in minutes (1-60).

Mappings:
  EnvConfig:
    paper:
      SSMPrefix: "/stock-bot/"
      BucketSuffix: ""
    live:
      SSMPrefix: "/stock-bot-live/"
      BucketSuffix: "-live"
    experimental:
      SSMPrefix: "/stock-bot-2/"
      BucketSuffix: "-2"

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  IsSingleMinute: !Equals [!Ref MonitorIntervalMinutes, 1]

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Architectures:
      - arm64
    Tags:
      Project: stock-trading-bot
      Environment: !Ref Environment
    Environment:
      Variables:
        TRADES_DB_BUCKET: !Ref TradesDbBucket
        TRADES_DB_KEY: trades.db
        DB_PATH: /tmp/trades.db
        SNS_TOPIC_ARN: !Ref TradingAlertsTopic
        NOTIFIER_TYPE: console+sns
        NOTIFICATION_EMAIL: !If [HasNotificationEmail, !Ref NotificationEmail, ""]
        SSM_PREFIX: !FindInMap [EnvConfig, !Ref Environment, SSMPrefix]
        NOTIFY_FREQUENCY: hourly

Resources:
  # S3 bucket for persistent trades.db storage
  TradesDbBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - "stock-trader-db${BucketSuffix}-${AWS::AccountId}"
        - BucketSuffix: !FindInMap [EnvConfig, !Ref Environment, BucketSuffix]
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Every handler run uploads trades.db back (up to once a minute),
          # creating a noncurrent version. The DB is cumulative (each version
          # contains the full history), so old versions are redundant
          # point-in-time copies — expire them after a 3-day rollback window
          # (covers a weekend), always keeping the 5 newest.
          - Id: expire-old-db-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 3
              NewerNoncurrentVersions: 5
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Weekly audit exports (archive/YYYY-Www.json.gz) are write-once:
          # transition straight to the cheapest storage class and keep 7
          # years for the audit trail.
          - Id: audit-exports-to-deep-archive
            Status: Enabled
            Prefix: archive/
            Transitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 0
            ExpirationInDays: 2555
      Tags:
        - Key: Project
          Value: stock-trading-bot
        - Key: Environment
          Value: !Ref Environment

  # SNS topic for trade alerts
  TradingAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "Stock Trading Bot Alerts (${Environment})"
      Tags:
        - Key: Project
          Value: stock-trading-bot
        - Key: Environment
          Value: !Ref Environment

  # Email subscription (only created if email address provided)
  TradingAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref TradingAlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # IAM role for Lambda functions
  TradingBotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3TradesDbAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${TradesDbBucket}"
                  - !Sub "arn:aws:s3:::${TradesDbBucket}/*"
        - PolicyName: SNSPublishAlerts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref TradingAlertsTopic
        - PolicyName: SESSendEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref NotificationEmail
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                Resource:
                  - !Sub
                    - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SSMPrefix}*"
                    - SSMPrefix: !FindInMap [EnvConfig, !Ref Environment, SSMPrefix]

  # Lambda Function: Daily Scan (runs at market open on weekdays — see cron comment)
  DailyScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.daily_scan_handler
      Role: !GetAtt TradingBotRole.Arn
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 14 ? * MON-FRI *)  # 14:30 UTC = 09:30 EST / 10:30 EDT (EventBridge cron is UTC, no DST)
            Description: Daily market scan at 09:30 ET
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Stop-Loss Monitor (every MonitorIntervalMinutes, default 1 min; handler no-ops outside market hours)
  MonitorStopsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.monitor_stops_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        MonitorSchedule:
          Type: Schedule
          Properties:
            Schedule: !If
              - IsSingleMinute
              - "rate(1 minute)"
              - !Sub "rate(${MonitorIntervalMinutes} minutes)"
            Description: !Sub "Stop-loss check every ${MonitorIntervalMinutes} minute(s)"
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: End-of-Day Snapshot (runs at 15:55 ET weekdays)
  EodSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.eod_snapshot_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        EodSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(55 20 ? * MON-FRI *)  # 20:55 UTC = 15:55 EST / 16:55 EDT (EventBridge cron is UTC, no DST)
            Description: End-of-day snapshot at 15:55 ET
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Weekly Digest (runs Friday 15:55 ET)
  WeeklyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.weekly_digest_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(55 20 ? * FRI *)  # Friday 20:55 UTC = 15:55 EST / 16:55 EDT (EventBridge cron is UTC, no DST)
            Description: Weekly performance digest on Fridays
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Hourly Digest (runs every 60 min during market hours)
  HourlyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.hourly_digest_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 15-20 ? * MON-FRI *)  # Hourly 15:30–20:30 UTC = 10:30–15:30 EST / 11:30–16:30 EDT (EventBridge cron is UTC, no DST)
            Description: Hourly trade activity digest during market hours
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Kill Switch (manual invoke only, no schedule)
  KillSwitchFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.kill_switch_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

Outputs:
  DailyScanFunctionArn:
    Description: Daily Scan Lambda ARN
    Value: !GetAtt DailyScanFunction.Arn
  MonitorStopsFunctionArn:
    Description: Stop Monitor Lambda ARN
    Value: !GetAtt MonitorStopsFunction.Arn
  TradesDbBucketName:
    Description: S3 bucket for trades database
    Value: !Ref TradesDbBucket
  TradingAlertsTopicArn:
    Description: SNS topic ARN for trade alerts
    Value: !Ref TradingAlertsTopic
  KillSwitchFunctionName:
    Description: Kill Switch Lambda function name (invoke with aws lambda invoke)
    Value: !Ref KillSwitchFunction
