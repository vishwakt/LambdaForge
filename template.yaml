AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Stock Trading Bot — Automated daily trading via Alpaca API

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: Email address for trade alerts. Leave empty to skip email notifications.
  MonitorIntervalMinutes:
    Type: Number
    Default: 2
    Description: Stop-loss and trading monitor interval in minutes (1-60).

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Architectures:
      - arm64
    Environment:
      Variables:
        TRADES_DB_BUCKET: !Ref TradesDbBucket
        TRADES_DB_KEY: trades.db
        DB_PATH: /tmp/trades.db
        SNS_TOPIC_ARN: !Ref TradingAlertsTopic
        NOTIFIER_TYPE: console+sns
        NOTIFICATION_EMAIL: !If [HasNotificationEmail, !Ref NotificationEmail, ""]

Resources:
  # S3 bucket for persistent trades.db storage
  TradesDbBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "stock-trader-db-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  # SNS topic for trade alerts
  TradingAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Stock Trading Bot Alerts

  # Email subscription (only created if email address provided)
  TradingAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref TradingAlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # IAM role for Lambda functions
  TradingBotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3TradesDbAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${TradesDbBucket}"
                  - !Sub "arn:aws:s3:::${TradesDbBucket}/*"
        - PolicyName: SNSPublishAlerts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref TradingAlertsTopic
        - PolicyName: SESSendEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref NotificationEmail
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stock-bot/*"

  # Lambda Function: Daily Scan (runs at 09:45 ET weekdays)
  DailyScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.daily_scan_handler
      Role: !GetAtt TradingBotRole.Arn
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(45 14 ? * MON-FRI *)  # 09:45 ET = 14:45 UTC
            Description: Daily market scan at 09:45 ET
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Stop-Loss Monitor (every 15 min during market hours)
  MonitorStopsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.monitor_stops_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        MonitorSchedule:
          Type: Schedule
          Properties:
            Schedule: !Sub "rate(${MonitorIntervalMinutes} minutes)"
            Description: !Sub "Stop-loss check every ${MonitorIntervalMinutes} minutes"
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: End-of-Day Snapshot (runs at 15:55 ET weekdays)
  EodSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.eod_snapshot_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        EodSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(55 20 ? * MON-FRI *)  # 15:55 ET = 20:55 UTC
            Description: End-of-day snapshot at 15:55 ET
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Weekly Digest (runs Friday 15:55 ET)
  WeeklyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.weekly_digest_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(55 20 ? * FRI *)  # Friday 15:55 ET = 20:55 UTC
            Description: Weekly performance digest on Fridays
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

Outputs:
  DailyScanFunctionArn:
    Description: Daily Scan Lambda ARN
    Value: !GetAtt DailyScanFunction.Arn
  MonitorStopsFunctionArn:
    Description: Stop Monitor Lambda ARN
    Value: !GetAtt MonitorStopsFunction.Arn
  TradesDbBucketName:
    Description: S3 bucket for trades database
    Value: !Ref TradesDbBucket
  TradingAlertsTopicArn:
    Description: SNS topic ARN for trade alerts
    Value: !Ref TradingAlertsTopic
