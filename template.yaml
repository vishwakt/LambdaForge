AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Stock Trading Bot — Automated daily trading via Alpaca API

Parameters:
  Environment:
    Type: String
    Default: paper
    AllowedValues: [paper, live, experimental]
    Description: Trading environment. Determines SSM prefix, S3 bucket, and stack isolation.
  NotificationEmail:
    Type: String
    Default: ""
    Description: Email address for trade alerts. Leave empty to skip email notifications.
  MonitorIntervalMinutes:
    Type: Number
    Default: 1
    Description: Stop-loss and trading monitor interval in minutes (1-60).

Mappings:
  EnvConfig:
    paper:
      SSMPrefix: "/stock-bot/"
      BucketSuffix: ""
    live:
      SSMPrefix: "/stock-bot-live/"
      BucketSuffix: "-live"
    experimental:
      SSMPrefix: "/stock-bot-2/"
      BucketSuffix: "-2"

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  IsSingleMinute: !Equals [!Ref MonitorIntervalMinutes, 1]
  # The Telegram ops function controls every stack, so it is deployed once,
  # alongside the paper stack.
  IsPaper: !Equals [!Ref Environment, paper]
  # Stack 1 (paper) is archived, not migrated: its Alpaca keys no longer
  # work, so it gets no table (docs/DYNAMODB-PLAN.md, 7.5).
  HasTradesTable: !Not [!Equals [!Ref Environment, paper]]

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Architectures:
      - arm64
    Tags:
      Project: stock-trading-bot
      Environment: !Ref Environment
    Environment:
      Variables:
        TRADES_DB_BUCKET: !Ref TradesDbBucket
        TRADES_DB_KEY: trades.db
        DB_PATH: /tmp/trades.db
        SNS_TOPIC_ARN: !Ref TradingAlertsTopic
        NOTIFIER_TYPE: console+sns
        NOTIFICATION_EMAIL: !If [HasNotificationEmail, !Ref NotificationEmail, ""]
        SSM_PREFIX: !FindInMap [EnvConfig, !Ref Environment, SSMPrefix]
        NOTIFY_FREQUENCY: hourly
        # Used only once the store parameter says shadow or dynamodb. Stack 1
        # has no table; its store stays sqlite, so the name is never used.
        TRADES_TABLE: !Sub
          - "stock-trader${BucketSuffix}"
          - BucketSuffix: !FindInMap [EnvConfig, !Ref Environment, BucketSuffix]

Resources:
  # S3 bucket for persistent trades.db storage
  TradesDbBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - "stock-trader-db${BucketSuffix}-${AWS::AccountId}"
        - BucketSuffix: !FindInMap [EnvConfig, !Ref Environment, BucketSuffix]
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Every handler run uploads trades.db back (up to once a minute),
          # creating a noncurrent version. The DB is cumulative (each version
          # contains the full history), so old versions are redundant
          # point-in-time copies — expire them after a 3-day rollback window
          # (covers a weekend), always keeping the 5 newest.
          - Id: expire-old-db-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 3
              NewerNoncurrentVersions: 5
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Weekly audit exports (archive/YYYY-Www.json.gz) are write-once:
          # transition straight to the cheapest storage class and keep 7
          # years for the audit trail.
          - Id: audit-exports-to-deep-archive
            Status: Enabled
            Prefix: archive/
            Transitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 0
            ExpirationInDays: 2555
          # The trades.db frozen at the DynamoDB cutover stays readable for
          # 90 days (a rollback rebuilds trades.db from it), then archives.
          - Id: frozen-trades-db-to-deep-archive
            Status: Enabled
            Prefix: frozen/
            Transitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 90
      Tags:
        - Key: Project
          Value: stock-trading-bot
        - Key: Environment
          Value: !Ref Environment

  # The trade store once the store parameter says dynamodb (src/store.py).
  # One item per trades.db row; see src/dynamo_store.py for the keys.
  TradesTable:
    Type: AWS::DynamoDB::Table
    Condition: HasTradesTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub
        - "stock-trader${BucketSuffix}"
        - BucketSuffix: !FindInMap [EnvConfig, !Ref Environment, BucketSuffix]
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Trades in time order
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Sparse: only buys still pending or open
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: stock-trading-bot
        - Key: Environment
          Value: !Ref Environment

  # SNS topic for trade alerts
  TradingAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "Stock Trading Bot Alerts (${Environment})"
      Tags:
        - Key: Project
          Value: stock-trading-bot
        - Key: Environment
          Value: !Ref Environment

  # Email subscription (only created if email address provided)
  TradingAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref TradingAlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # IAM role for Lambda functions
  TradingBotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3TradesDbAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${TradesDbBucket}"
                  - !Sub "arn:aws:s3:::${TradesDbBucket}/*"
        - PolicyName: SNSPublishAlerts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref TradingAlertsTopic
        - PolicyName: SESSendEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref NotificationEmail
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                Resource:
                  - !Sub
                    - "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SSMPrefix}*"
                    - SSMPrefix: !FindInMap [EnvConfig, !Ref Environment, SSMPrefix]
        - !If
          - HasTradesTable
          - PolicyName: DynamoDBTradesTable
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:ConditionCheckItem
                    - dynamodb:Query
                    - dynamodb:Scan
                    - dynamodb:BatchWriteItem
                    - dynamodb:DescribeTable
                    - dynamodb:CreateBackup
                  Resource:
                    - !GetAtt TradesTable.Arn
                    - !Sub "${TradesTable.Arn}/index/*"
          - !Ref AWS::NoValue

  # Lambda Function: Daily Scan (runs at 09:30 ET weekdays — market open)
  DailyScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.daily_scan_handler
      Role: !GetAtt TradingBotRole.Arn
      Events:
        # Event keys end in "Local" because SAM derives the CloudFormation
        # logical ID from them, and CloudFormation cannot change an existing
        # resource's type in place (Events::Rule -> Scheduler::Schedule).
        # New IDs = create the schedules, delete the old rules.
        DailyScheduleLocal:
          # EventBridge Scheduler (not a classic rule): cron runs in the
          # given timezone, so 09:30 stays 09:30 across DST transitions.
          Type: ScheduleV2
          Properties:
            # SAM defaults the Scheduler Name to the logical ID, which is the
            # same in every stack — schedules live in one account-wide group,
            # so paper/live/bot-2 would collide. Prefix with the stack name.
            Name: !Sub "${AWS::StackName}-daily-scan"
            ScheduleExpression: cron(30 9 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Description: Daily market scan at 09:30 ET (market open)
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Stop-Loss Monitor (every MonitorIntervalMinutes, default 1 min;
  # the handler no-ops outside market hours, so a plain rate() rule is fine here)
  MonitorStopsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.monitor_stops_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        MonitorSchedule:
          Type: Schedule
          Properties:
            Schedule: !If
              - IsSingleMinute
              - "rate(1 minute)"
              - !Sub "rate(${MonitorIntervalMinutes} minutes)"
            Description: !Sub "Stop-loss check every ${MonitorIntervalMinutes} minute(s)"
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: End-of-Day Snapshot (runs at 15:55 ET weekdays)
  EodSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.eod_snapshot_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        EodScheduleLocal:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-eod-snapshot"
            ScheduleExpression: cron(55 15 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Description: End-of-day snapshot at 15:55 ET
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Weekly Digest (runs Friday 15:55 ET)
  WeeklyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.weekly_digest_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        WeeklyScheduleLocal:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-weekly-digest"
            ScheduleExpression: cron(55 15 ? * FRI *)
            ScheduleExpressionTimezone: America/New_York
            Description: Weekly performance digest on Fridays at 15:55 ET
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Hourly Digest (runs every 60 min during market hours)
  HourlyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.hourly_digest_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
      Events:
        HourlyScheduleLocal:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-hourly-digest"
            ScheduleExpression: cron(30 10-15 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/New_York
            Description: Hourly trade activity digest, 10:30-15:30 ET
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Kill Switch (manual invoke only, no schedule)
  KillSwitchFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.kill_switch_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 120
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # Lambda Function: Store migration (invoked by the migration workflow or by
  # hand; no schedule). Modes are in src/migrate.py.
  MigrateFunction:
    Type: AWS::Serverless::Function
    Condition: HasTradesTable
    Properties:
      FunctionName: !Sub "${AWS::StackName}-migrate"
      PackageType: Image
      ImageConfig:
        Command:
          - handler.migrate_handler
      Role: !GetAtt TradingBotRole.Arn
      Timeout: 900
      MemorySize: 1024
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # --- Telegram ops (paper stack only; controls all three stacks) ---

  TelegramOpsRole:
    Type: AWS::IAM::Role
    Condition: IsPaper
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TelegramOps
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Bot settings + every stack's params (kill switch, Alpaca keys)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stock-bot-ops/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stock-bot/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stock-bot-2/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stock-bot-live/*"
              # Find and invoke each stack's KillSwitchFunction
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/stock-trading-bot*/*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:stock-trading-bot*-KillSwitchFunction-*"

  # Lambda Function: Telegram webhook (Function URL; secret header checked in code)
  TelegramOpsFunction:
    Type: AWS::Serverless::Function
    Condition: IsPaper
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - handler.telegram_webhook_handler
      Role: !GetAtt TelegramOpsRole.Arn
      Timeout: 90
      Environment:
        Variables:
          OPS_SSM_PREFIX: /stock-bot-ops/
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

Outputs:
  TelegramWebhookUrl:
    Condition: IsPaper
    Description: Register with Telegram via setWebhook (see README)
    Value: !GetAtt TelegramOpsFunctionUrl.FunctionUrl
  DailyScanFunctionArn:
    Description: Daily Scan Lambda ARN
    Value: !GetAtt DailyScanFunction.Arn
  MonitorStopsFunctionArn:
    Description: Stop Monitor Lambda ARN
    Value: !GetAtt MonitorStopsFunction.Arn
  TradesDbBucketName:
    Description: S3 bucket for trades database
    Value: !Ref TradesDbBucket
  TradingAlertsTopicArn:
    Description: SNS topic ARN for trade alerts
    Value: !Ref TradingAlertsTopic
  KillSwitchFunctionName:
    Description: Kill Switch Lambda function name (invoke with aws lambda invoke)
    Value: !Ref KillSwitchFunction
  TradesTableName:
    Condition: HasTradesTable
    Description: DynamoDB trade store
    Value: !Ref TradesTable
  MigrateFunctionName:
    Condition: HasTradesTable
    Description: Store migration Lambda (see src/migrate.py)
    Value: !Ref MigrateFunction
