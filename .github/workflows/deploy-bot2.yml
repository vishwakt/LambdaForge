name: Build & Deploy Bot 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for re-running a deploy without a code change
  # (e.g., after an IAM/OIDC fix or an SSM parameter update).
  workflow_dispatch:

# Serialize deploys targeting the same CloudFormation stack. Without this,
# back-to-back pushes (e.g. merging multiple Dependabot PRs in quick
# succession) can race and fail with "Stack is in UPDATE_IN_PROGRESS".
# Queue, don't cancel — killing an in-flight SAM deploy mid-changeset
# is worse than waiting.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SAM_STACK_NAME: stock-trading-bot-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU for ARM builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if needed
        run: |
          aws ecr describe-repositories --repository-names stock-trading-bot-2 2>/dev/null || \
          aws ecr create-repository --repository-name stock-trading-bot-2

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/stock-trading-bot-2:latest"
          docker buildx build --platform linux/arm64 -t "$IMAGE_URI" --load .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --image-repository ${{ steps.ecr-login.outputs.registry }}/stock-trading-bot-2 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              NotificationEmail=${{ secrets.NOTIFICATION_EMAIL }} \
              Environment=experimental
