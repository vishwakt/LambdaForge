name: Deploy one bot

# Deploys one bot's stack from the image deploy.yml's build job pushed.
# Called by deploy.yml for every bot on each push to main. Every name comes
# from the bot's entry in bots.json, so adding a bot needs no edit here.

on:
  workflow_call:
    inputs:
      bot:
        description: Bot name from bots.json, e.g. stock-bot-3
        required: true
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy per stack at a time, whichever workflow started it. Without
    # this, back-to-back pushes race and fail with "Stack is in
    # UPDATE_IN_PROGRESS". Queue, don't cancel: killing an in-flight SAM
    # deploy mid-changeset is worse than waiting.
    concurrency:
      group: deploy-${{ inputs.bot }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Read the bot from bots.json
        id: bot
        env:
          BOT: ${{ inputs.bot }}
        run: |
          entry=$(jq -ce --arg name "$BOT" '.bots[] | select(.name == $name)' bots.json) || {
            echo "::error::$BOT is not in bots.json"
            exit 1
          }
          suffix="${BOT#stock-bot}"
          {
            echo "suffix=$suffix"
            echo "stack=stock-trading-bot$suffix"
            echo "environment=$(jq -r .environment <<<"$entry")"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The packaged template from deploy.yml's build job: the same image
      # for every bot.
      - uses: actions/download-artifact@v8
        with:
          name: packaged-template

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Is this the stack's first deploy?
        id: before
        env:
          STACK: ${{ steps.bot.outputs.stack }}
        run: |
          if aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SAM Deploy
        env:
          STACK: ${{ steps.bot.outputs.stack }}
          SUFFIX: ${{ steps.bot.outputs.suffix }}
          ENVIRONMENT: ${{ steps.bot.outputs.environment }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          overrides=("NotificationEmail=$NOTIFICATION_EMAIL" "Environment=$ENVIRONMENT")
          # Stack 1's suffix is empty, which is BotSuffix's default.
          if [ -n "$SUFFIX" ]; then overrides+=("BotSuffix=$SUFFIX"); fi
          # sam deploy requires an image repository even though the packaged
          # template already points at a pushed image, so it pushes nothing.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sam deploy \
            --template-file packaged.yaml \
            --stack-name "$STACK" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --image-repository "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/stock-trading-bot-images" \
            --capabilities CAPABILITY_IAM \
            --tags Project=stock-trading-bot Environment="$ENVIRONMENT" \
            --parameter-overrides "${overrides[@]}"

      # A new bot has no history to migrate, so it starts on DynamoDB. init
      # refuses a stack with any rows, so this can never wipe or skip one.
      - name: Start a new bot on DynamoDB
        if: steps.before.outputs.new == 'true' && steps.bot.outputs.environment != 'paper'
        run: scripts/migration_step.sh "${{ steps.bot.outputs.stack }}" init

      # The shared repo's lifecycle policy never expires an image tagged with
      # a bot's name, and Lambda fails every call to a function whose image is
      # gone. So tag the image this bot now runs; the tag moves off the image
      # it ran before, which then ages out like any other. Last, so a failure
      # here can't skip init on a new bot's first deploy.
      - name: Tag the image this bot runs
        env:
          BOT: ${{ inputs.bot }}
          STACK: ${{ steps.bot.outputs.stack }}
          ECR_REPO: stock-trading-bot-images
        run: |
          functions=$(aws cloudformation list-stack-resources --stack-name "$STACK" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" \
            --output text)
          uris=$(for f in $functions; do
            aws lambda get-function --function-name "$f" --query Code.ResolvedImageUri --output text
          done | sort -u)
          if [ "$(wc -l <<<"$uris")" -ne 1 ] || [[ "$uris" != */"$ECR_REPO"@sha256:* ]]; then
            echo "::error::$STACK's functions don't all run one image from $ECR_REPO: $uris"
            exit 1
          fi
          digest=${uris#*@}
          manifest=$(aws ecr batch-get-image --repository-name "$ECR_REPO" \
            --image-ids imageDigest="$digest" --query 'images[0].imageManifest' --output text)
          # --image-digest makes ECR refuse a manifest that isn't this image's.
          if out=$(aws ecr put-image --repository-name "$ECR_REPO" --image-tag "$BOT" \
                --image-digest "$digest" --image-manifest "$manifest" 2>&1); then
            echo "Tagged $digest as $BOT"
          elif grep -q ImageAlreadyExistsException <<<"$out"; then
            echo "$digest is already tagged $BOT"
          else
            echo "::error::Could not tag $digest as $BOT: $out"
            exit 1
          fi
