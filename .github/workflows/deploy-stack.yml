name: Deploy one bot

# Builds the image and deploys one bot's stack. Called by deploy.yml (every
# bot with deploy: auto, on each push to main) and deploy-live.yml. Every name
# comes from the bot's entry in bots.json, so adding a bot needs no edit here.

on:
  workflow_call:
    inputs:
      bot:
        description: Bot name from bots.json, e.g. stock-bot-3
        required: true
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy per stack at a time, whichever workflow started it. Without
    # this, back-to-back pushes race and fail with "Stack is in
    # UPDATE_IN_PROGRESS". Queue, don't cancel: killing an in-flight SAM
    # deploy mid-changeset is worse than waiting.
    concurrency:
      group: deploy-${{ inputs.bot }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Read the bot from bots.json
        id: bot
        env:
          BOT: ${{ inputs.bot }}
        run: |
          entry=$(jq -ce --arg name "$BOT" '.bots[] | select(.name == $name)' bots.json) || {
            echo "::error::$BOT is not in bots.json"
            exit 1
          }
          suffix="${BOT#stock-bot}"
          {
            echo "suffix=$suffix"
            echo "stack=stock-trading-bot$suffix"
            echo "environment=$(jq -r .environment <<<"$entry")"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU for ARM builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repo, cost tags, and lifecycle policy
        env:
          ECR_REPO: ${{ steps.bot.outputs.stack }}
          ENVIRONMENT: ${{ steps.bot.outputs.environment }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPO"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          # ECR repos live outside the CloudFormation stack, so stack tags do
          # not reach them. Tag explicitly or this cost is unattributable.
          aws ecr tag-resource \
            --resource-arn "arn:aws:ecr:${AWS_REGION}:${ACCOUNT_ID}:repository/${ECR_REPO}" \
            --tags Key=Project,Value=stock-trading-bot Key=Environment,Value="$ENVIRONMENT"
          # Every deploy leaves two images behind: the orphaned previous
          # :latest, and SAM's own tagged push. Without this they accumulate
          # forever. Idempotent — re-applying the same policy is a no-op.
          aws ecr put-lifecycle-policy \
            --repository-name "$ECR_REPO" \
            --lifecycle-policy-text file://ecr-lifecycle-policy.json

      - name: Build and push Docker image
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ steps.bot.outputs.stack }}:latest
        run: |
          docker buildx build --platform linux/arm64 -t "$IMAGE_URI" --load .
          docker push "$IMAGE_URI"

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build

      - name: Is this the stack's first deploy?
        id: before
        env:
          STACK: ${{ steps.bot.outputs.stack }}
        run: |
          if aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SAM Deploy
        env:
          STACK: ${{ steps.bot.outputs.stack }}
          SUFFIX: ${{ steps.bot.outputs.suffix }}
          ENVIRONMENT: ${{ steps.bot.outputs.environment }}
          REPOSITORY: ${{ steps.ecr-login.outputs.registry }}/${{ steps.bot.outputs.stack }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          overrides=("NotificationEmail=$NOTIFICATION_EMAIL" "Environment=$ENVIRONMENT")
          # Stack 1's suffix is empty, which is BotSuffix's default.
          if [ -n "$SUFFIX" ]; then overrides+=("BotSuffix=$SUFFIX"); fi
          sam deploy \
            --stack-name "$STACK" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --image-repository "$REPOSITORY" \
            --capabilities CAPABILITY_IAM \
            --tags Project=stock-trading-bot Environment="$ENVIRONMENT" \
            --parameter-overrides "${overrides[@]}"

      # A new bot has no history to migrate, so it starts on DynamoDB. init
      # refuses a stack with any rows, so this can never wipe or skip one.
      - name: Start a new bot on DynamoDB
        if: steps.before.outputs.new == 'true' && steps.bot.outputs.environment != 'paper'
        run: scripts/migration_step.sh "${{ steps.bot.outputs.stack }}" init
