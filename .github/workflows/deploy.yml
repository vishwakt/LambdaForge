name: Build & Deploy

# Deploys every bot in bots.json, one job per bot, on each push to main.

on:
  push:
    branches: [main]
    # Docs-only changes never affect deployable artifacts. Skip the
    # rebuild + ECR push + empty-changeset SAM deploy that would
    # otherwise burn ~5–8 min of CI per docs merge.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - 'LICENSE'
  # Manual trigger for re-running a deploy without a code change
  # (e.g., after an IAM/OIDC fix or an SSM parameter update).
  workflow_dispatch:
    inputs:
      bot:
        description: One bot from bots.json, or blank for all of them
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  plan:
    runs-on: ubuntu-latest
    outputs:
      bots: ${{ steps.pick.outputs.bots }}
    steps:
      - uses: actions/checkout@v7

      - id: pick
        env:
          BOT: ${{ inputs.bot }}
        run: |
          bots=$(jq -c --arg bot "$BOT" \
            '[.bots[] | select($bot == "" or .name == $bot) | .name]' \
            bots.json)
          if [ "$bots" = "[]" ]; then
            echo "::error::no bot matches '$BOT' in bots.json"
            exit 1
          fi
          echo "bots=$bots" >> "$GITHUB_OUTPUT"
          echo "Deploying: $bots"

  # Builds the image once and pushes it to one repository that every bot
  # deploys from. Each bot's image used to be built and stored on its own,
  # identical but billed once per bot.
  build:
    needs: [test, plan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Queue, don't cancel, so back-to-back pushes reach the deploy jobs in
    # order and an older image can't deploy after a newer one.
    concurrency:
      group: build-image
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      ECR_REPO: stock-trading-bot-images
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest moved to 26.04 (Docker 29) in Nov 2026, which uses the
      # containerd image store. On it, sam build's classic builder can't
      # build our arm64 image: "failed to export image: NotFound: content
      # digest ... not found" (the base image's amd64 manifest). Switch back
      # to the classic store before anything else touches Docker.
      - name: Use Docker's classic image store
        run: |
          f=/etc/docker/daemon.json
          sudo test -s "$f" || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '.features["containerd-snapshotter"] = false' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker
          docker info -f 'Docker {{.ServerVersion}}, storage driver {{.Driver}}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU for ARM builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repo, cost tags, and lifecycle policy
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPO"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          # ECR repos live outside the CloudFormation stacks, so stack tags do
          # not reach them. Tag explicitly or this cost is unattributable.
          aws ecr tag-resource \
            --resource-arn "arn:aws:ecr:${AWS_REGION}:${ACCOUNT_ID}:repository/${ECR_REPO}" \
            --tags Key=Project,Value=stock-trading-bot Key=Environment,Value=shared
          # Keeps the 3 newest images and any image a bot runs (see the
          # file). Idempotent — re-applying the same policy is a no-op.
          aws ecr put-lifecycle-policy \
            --repository-name "$ECR_REPO" \
            --lifecycle-policy-text file://ecr-lifecycle-policy.json

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build

      # Every function runs the same image, so SAM pushes one. The packaged
      # template points each function at it, and every bot deploys that file.
      - name: Push the image and write the packaged template
        env:
          REPOSITORY: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}
        run: |
          sam package \
            --template-file .aws-sam/build/template.yaml \
            --image-repository "$REPOSITORY" \
            --resolve-s3 \
            --output-template-file packaged.yaml

      - uses: actions/upload-artifact@v7
        with:
          name: packaged-template
          path: packaged.yaml
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [test, plan, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(needs.plan.outputs.bots) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-stack.yml
    with:
      bot: ${{ matrix.bot }}
    secrets: inherit
