name: Build & Deploy

# Deploys every bot in bots.json with deploy: auto, one job per bot, on each
# push to main. Bots with deploy: manual go through Deploy Live instead.

on:
  push:
    branches: [main]
    # Docs-only changes never affect deployable artifacts. Skip the
    # rebuild + ECR push + empty-changeset SAM deploy that would
    # otherwise burn ~5–8 min of CI per docs merge.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - 'LICENSE'
  # Manual trigger for re-running a deploy without a code change
  # (e.g., after an IAM/OIDC fix or an SSM parameter update).
  workflow_dispatch:
    inputs:
      bot:
        description: One bot from bots.json (deploy auto), or blank for all of them
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  plan:
    runs-on: ubuntu-latest
    outputs:
      bots: ${{ steps.pick.outputs.bots }}
    steps:
      - uses: actions/checkout@v6

      - id: pick
        env:
          BOT: ${{ inputs.bot }}
        run: |
          bots=$(jq -c --arg bot "$BOT" \
            '[.bots[] | select(.deploy == "auto" and ($bot == "" or .name == $bot)) | .name]' \
            bots.json)
          if [ "$bots" = "[]" ]; then
            echo "::error::no bot with deploy: auto matches '$BOT' in bots.json"
            exit 1
          fi
          echo "bots=$bots" >> "$GITHUB_OUTPUT"
          echo "Deploying: $bots"

  deploy:
    needs: [test, plan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(needs.plan.outputs.bots) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-stack.yml
    with:
      bot: ${{ matrix.bot }}
    secrets: inherit
