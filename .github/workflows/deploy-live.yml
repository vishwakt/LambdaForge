name: Deploy Live

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-LIVE to confirm live deployment'
        required: true
        type: string

# Serialize deploys targeting the same CloudFormation stack. Paired with the
# DEPLOY-LIVE confirmation input, this means a live deploy also can't race
# against itself if someone fires workflow_dispatch twice.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SAM_STACK_NAME: stock-trading-bot-live

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Verify deployment confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY-LIVE" ]; then
            echo "::error::You must type DEPLOY-LIVE to confirm. Aborting."
            exit 1
          fi
          echo "Live deployment confirmed."

      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU for ARM builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if needed
        run: |
          aws ecr describe-repositories --repository-names stock-trading-bot-live 2>/dev/null || \
          aws ecr create-repository --repository-name stock-trading-bot-live

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/stock-trading-bot-live:latest"
          docker buildx build --platform linux/arm64 -t "$IMAGE_URI" --load .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --image-repository ${{ steps.ecr-login.outputs.registry }}/stock-trading-bot-live \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              NotificationEmail=${{ secrets.NOTIFICATION_EMAIL }} \
              Environment=live
