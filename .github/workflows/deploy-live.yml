name: Deploy Live

# The one bot with deploy: manual in bots.json. Runs only when started by
# hand, with DEPLOY-LIVE typed as confirmation.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-LIVE to confirm live deployment'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY-LIVE" ]; then
            echo "::error::You must type DEPLOY-LIVE to confirm. Aborting."
            exit 1
          fi
          echo "Live deployment confirmed."

  deploy:
    needs: [test, confirm]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-stack.yml
    with:
      bot: stock-bot-live
    secrets: inherit
